[project]
name = "erizocoach"
version = "0.26.0"
description = "Asistente local para League of Legends: runas, hechizos y builds recomendadas."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "cryptography>=44",
    "keyring>=25",
    "psutil>=6.1",
    "pywebview>=5.3",
]

[project.scripts]
erizocoach = "erizocoach.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "trustme>=1.2",
    "ruff>=0.9",
    "pyinstaller>=6.11",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erizocoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permitimos tildes y símbolos en textos en español

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "ASYNC110", "RUF012"]  # esperas por sondeo y datos de prueba
